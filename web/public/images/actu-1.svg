<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Le gong de la rentrée : cloche dorée et ondes sonores">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#0B0E14"/>
      <stop offset="1" stop-color="#151A24"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.44" r="0.8">
      <stop offset="0.55" stop-color="#05070B" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070B" stop-opacity="0.82"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F0DA" stop-opacity="0.42"/>
      <stop offset="0.75" stop-color="#F6F0DA" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#F6F0DA" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowOr"><stop offset="0" stop-color="#E4CE7E" stop-opacity="0.5"/><stop offset="1" stop-color="#E4CE7E" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowBleu"><stop offset="0" stop-color="#2159D8" stop-opacity="0.55"/><stop offset="1" stop-color="#2159D8" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowRouge"><stop offset="0" stop-color="#D7263D" stop-opacity="0.5"/><stop offset="1" stop-color="#D7263D" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowCraie"><stop offset="0" stop-color="#F6F0DA" stop-opacity="0.4"/><stop offset="1" stop-color="#F6F0DA" stop-opacity="0"/></radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.92  0 0 0 0 0.90  0 0 0 0 0.84  0 0 0 0.06 0"/>
    </filter>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

  <ellipse cx="600" cy="350" rx="380" ry="300" fill="url(#glowOr)" opacity="0.55"/>
  <circle cx="600" cy="350" r="150" fill="#0D1320" stroke="#E4CE7E" stroke-width="8"/>
  <circle cx="600" cy="350" r="108" fill="none" stroke="#E4CE7E" stroke-opacity="0.5" stroke-width="4"/>
  <circle cx="600" cy="350" r="26" fill="#E4CE7E"/>
  <path d="M 800 480 L 900 560" stroke="#E8E6DF" stroke-opacity="0.6" stroke-width="10" stroke-linecap="round"/>
  <circle cx="912" cy="570" r="26" fill="#10151F" stroke="#E8E6DF" stroke-opacity="0.4" stroke-width="4"/>
  <path d="M 390 260 Q 350 350 390 440 M 330 220 Q 270 350 330 480" stroke="#2159D8" stroke-opacity="0.55" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 810 260 Q 850 350 810 440 M 870 220 Q 930 350 870 480" stroke="#2159D8" stroke-opacity="0.55" stroke-width="6" fill="none" stroke-linecap="round"/>

  <rect width="1200" height="750" filter="url(#grain)" opacity="0.55"/>
  <rect width="1200" height="750" fill="url(#vig)"/>
  <text x="600" y="719" text-anchor="middle" font-family="Barlow, Segoe UI, Arial, sans-serif" font-size="24" letter-spacing="5" fill="#E8E6DF" fill-opacity="0.4">ACTUALITÉ · LE GONG DE LA RENTRÉE</text>
</svg>
